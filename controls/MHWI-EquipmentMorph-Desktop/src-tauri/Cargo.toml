[package]
name = "mhwi-equipmentmorph-desktop"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"

[[bin]]
name = "MHWI-EquipmentMorph-ControlCenter"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
